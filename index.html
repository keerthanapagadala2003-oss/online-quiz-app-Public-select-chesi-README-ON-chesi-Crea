
<!DOCTYPE html>
<html>
<head>
  <title>Online Quiz App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2ff;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      margin: 30px auto;
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 4px 12px #ccc;
    }
    h1 {
      text-align: center;
      color: #5145a5;
    }
    .question {
      margin: 20px 0;
      font-weight: bold;
    }
    label {
      display: block;
      padding: 10px;
      margin: 7px 0;
      background: #f1f0ff;
      border-radius: 7px;
      cursor: pointer;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #5145a5;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      margin-top: 15px;
    }
    #result {
      text-align: center;
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Online Quiz App</h1>
  <p>Test your basic computer knowledge!</p>

  <form id="quizForm">
    <div class="question">
      1. What does HTML stand for?
      <label><input type="radio" name="q1" value="a"> Hyper Text Markup Language</label>
      <label><input type="radio" name="q1" value="b"> High Text Machine Language</label>
      <label><input type="radio" name="q1" value="c"> Home Tool Markup Language</label>
    </div>

    <div class="question">
      2. Which language is used for website styling?
      <label><input type="radio" name="q2" value="a"> Python</label>
      <label><input type="radio" name="q2" value="b"> CSS</label>
      <label><input type="radio" name="q2" value="c"> Java</label>
    </div>

    <div class="question">
      3. Which language makes a website interactive?
      <label><input type="radio" name="q3" value="a"> JavaScript</label>
      <label><input type="radio" name="q3" value="b"> HTML</label>
      <label><input type="radio" name="q3" value="c"> CSS</label>
    </div>

    <div class="question">
      4. What does CPU stand for?
      <label><input type="radio" name="q4" value="a"> Computer Personal Unit</label>
      <label><input type="radio" name="q4" value="b"> Central Processing Unit</label>
      <label><input type="radio" name="q4" value="c"> Control Power Utility</label>
    </div>

    <div class="question">
      5. Which one is a web browser?
      <label><input type="radio" name="q5" value="a"> MS Word</label>
      <label><input type="radio" name="q5" value="b"> Excel</label>
      <label><input type="radio" name="q5" value="c"> Google Chrome</label>
    </div>

    <button type="button" onclick="checkAnswers()">Submit Quiz</button>
  </form>

  <div id="result"></div>
</div>

<script>
function checkAnswers() {
  const answers = {
    q1: "a",
    q2: "b",
    q3: "a",
    q4: "b",
    q5: "c"
  };

  let score = 0;
  let attempted = 0;

  for (let question in answers) {
    const selected = document.querySelector(
      'input[name="' + question + '"]:checked'
    );

    if (selected) {
      attempted++;
      if (selected.value === answers[question]) {
        score++;
      }
    }
  }

  document.getElementById("result").innerHTML =
    "Your Score: " + score + " / 5<br>" +
    "Correct Answers: " + score + "<br>" +
    "Wrong Answers: " + (attempted - score) + "<br>" +
    "Not Attempted: " + (5 - attempted);
}
</script>

</body>
</html>
